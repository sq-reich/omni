<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parkhaussteuerung</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white text-center p-4">

  <div class="container">
    <h1 class="display-4 mb-4">🚗 Parkhaus System</h1>

    <div class="card bg-secondary text-white mb-4">
      <div class="card-body">
        <h3>Freie Plätze: <span class="badge bg-success fs-4">{{ frei }}</span></h3>
        <h5>Schrankenstatus: 
          {% if status == "offen" %} 
            <span class="text-success">🟢 Offen</span>
          {% else %}
            <span class="text-danger">🔴 Geschlossen</span>
          {% endif %}
        </h5>
      </div>
    </div>

    <div class="d-grid gap-3">
      {% if running %}
        <a href="/stop" class="btn btn-danger btn-lg">🛑 Parkhaus stoppen</a>
      {% else %}
        <a href="/start" class="btn btn-success btn-lg">🚀 Parkhaus starten</a>
      {% endif %}
      <a href="/tor-auf" class="btn btn-primary btn-lg">🔓 Tor öffnen</a>
      <a href="/tor-zu" class="btn btn-warning btn-lg">🔒 Tor schließen</a>
      <a href="/key" class="btn btn-outline-light btn-sm mt-3">🔧 Manuelle Steuerung</a>
    </div>
  </div>

</body>
</html>
